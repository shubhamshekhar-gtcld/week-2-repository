[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cloud_validator"
version = "0.1.0"
description = "Pydantic v2 cloud resource validator"
readme = "README.md"
requires-python = ">=3.9"
dependencies = ["pydantic>=2.5.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
cloud-validate = "cloud_validator.cli:main"
